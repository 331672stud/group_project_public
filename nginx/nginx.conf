worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout  65;
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --- RATE LIMITING ---
    # Definicja "stref" pamięci współdzielonej do zliczania żądań
    # $binary_remote_addr – klucz po adresie IP (oszczędność pamięci)
    # zone=api_limit:10m  – 10 MB pamięci na dane o IP (~160k unikalnych IP)
    # rate=10r/s          – średnio 10 żądań na sekundę
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Strefa dla zasobów statycznych – wyższy limit
    limit_req_zone $binary_remote_addr zone=static_limit:10m rate=100r/s;

    # Maksymalny rozmiar ciała żądania (zapobiega przesyłaniu ogromnych plików)
    client_max_body_size 20M;

    # Serwer HTTP – tylko przekierowuje na HTTPS
    server {
        listen 80;
        server_name localhost;  
        return 301 https://$host$request_uri;
    }

    # Serwer HTTPS
    server {
        listen 443 ssl http2;
        server_name localhost;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Nagłówki bezpieczeństwa
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # --- API Proxy ---
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://project_web:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rate limit: 10 żądań/sek, z "kolejką" (burst) do 20 dodatkowych
            limit_req zone=api_limit burst=20 nodelay;
        }

        # --- Frontend (pliki statyczne) ---
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;   # SPA routing

            # Rate limit dla statycznych plików
            limit_req zone=static_limit burst=50 nodelay;

            # Długie cachowanie statycznych assetów
            location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2?)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Blokada ukrytych plików (np. .env, .git)
        location ~ /\. {
            deny all;
        }
    }
}